name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tarn-lng/tarn:0.3.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and test with official Tarn container
        run: |
          tarn version
          tarn check lib.tarn
          tarn test tests.tarn
